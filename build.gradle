import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
	id 'dev.architectury.loom' version "${loom_version}"
	id "me.modmuss50.mod-publish-plugin" version "0.8.1"
	id "org.jetbrains.kotlin.jvm" version "2.3.10"
	id 'org.jetbrains.kotlin.plugin.serialization' version '2.3.10'
}

version = "$mod_version+$minecraft_version+$loader"
group = project.maven_group

base.archivesName = project.archives_base_name

repositories {
    mavenCentral()
    maven { url = "https://repo.spongepowered.org/maven" }
    maven { url = 'https://thedarkcolour.github.io/KotlinForForge/' }
	maven { url "https://jitpack.io" }
}

loom {
	accessWidenerPath = file("src/main/resources/bahalo.accesswidener")
    forge {
        convertAccessWideners = true
        mixinConfig "blue-archive-halo-client.mixin.json"
    }
}

sourceSets {
    main {
        java { srcDirs = ["src/main/java","src/client/java"] }
        kotlin { srcDirs = ["src/main/kotlin","src/client/kotlin"] }
        resources { srcDirs = ["src/main/resources","src/client/resources"] }
    }
}

dependencies {
    minecraft "net.minecraft:minecraft:${minecraft_version}"
    forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    mappings "net.fabricmc:yarn:$yarn_mappings:v2"

    implementation "thedarkcolour:kotlinforforge:$kff_version"
    compileOnly "org.jetbrains.kotlinx:kotlinx-serialization-core:$kotlin_serialization_version"
    compileOnly "org.jetbrains.kotlinx:kotlinx-serialization-json:$kotlin_serialization_version"
    compileOnly "org.spongepowered:mixin:0.8.5"
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"

	implementation("com.github.2894638479:KotlinMCUI:v${kotlinmcui_version}")
	modImplementation("com.github.2894638479:KotlinMCUI-backend:v${kotlinmcuibackend_version}-${loader}-${minecraft_version}@jar")
}

processResources {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            mod_version: mod_version, kff_version: kff_version, kotlinmcui_version: kotlinmcui_version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

tasks.withType(KotlinCompile).configureEach {
	compilerOptions.jvmTarget = JvmTarget.JVM_17
	compilerOptions.freeCompilerArgs.add('-Xcontext-parameters')
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	inputs.property "archivesName", base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}


def tag = "$mod_version-$minecraft_version-$loader"

def shouldPublishProvider = providers.exec {
	commandLine 'git', 'ls-remote', '--tags', 'origin', "refs/tags/${tag}"
}.standardOutput.asText.map { it.trim().isEmpty() }

tasks.configureEach {
	if (group == 'publishing') {
		enabled = shouldPublishProvider.get()
	}
}

publishMods {
	file = remapJar.archiveFile
	additionalFiles = files(sourcesJar.archiveFile,jar.archiveFile)
	changelog = "no changelog."
	if(mod_version.toUpperCase().contains("SNAPSHOT")) {
		type = ALPHA
	} else if(mod_version.toLowerCase().contains("alpha")) {
		type = ALPHA
	} else if(mod_version.toLowerCase().contains("beta")) {
		type = BETA
	} else {
		type = STABLE
	}
	displayName = "Blue Archive Halo $loader-$mod_version"
	modLoaders.add(loader)

	modrinth {
		accessToken = providers.environmentVariable("MODRINTH_TOKEN")
		projectId = "rtLQjYeH"
		requires("kotlinmcui","kotlin-for-forge")
		minecraftVersionRange {
			start = minecraft_version
			end = minecraft_version
		}
	}
	curseforge {
		accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
		projectId = "1368384"
		requires("kotlinmcui","kotlin-for-forge")
		clientRequired = true
		serverRequired = false
		minecraftVersionRange {
			start = minecraft_version
			end = minecraft_version
		}
	}
	github {
		accessToken = providers.environmentVariable("GITHUB_TOKEN")
		repository = "2894638479/fabric-blue-archive-halo"
		if(loader == "fabric") {
			commitish = minecraft_version
		} else {
			commitish = "$minecraft_version-$loader"
		}
		tagName = tag
	}
}