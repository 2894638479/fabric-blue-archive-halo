import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile
import net.fabricmc.loom.task.RemapJarTask

plugins {
    id "dev.architectury.loom" version "${loom_version}"
	id "me.modmuss50.mod-publish-plugin" version "0.8.1"
	id "org.jetbrains.kotlin.jvm" version "2.4.0"
	id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.0'
}
apply plugin: 'idea'
idea {
	module {
		downloadSources = true
	}
}
version = "$mod_version+$minecraft_version+$loader"
group = project.maven_group

base.archivesName = project.archives_base_name

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}


repositories {
	maven { url "https://jitpack.io" }
    mavenCentral()
    maven { url = "https://repo.spongepowered.org/maven" }
    maven { url = 'https://thedarkcolour.github.io/KotlinForForge/' }
    maven { url = 'https://maven.neoforged.net/releases/' }
}

loom {
	accessWidenerPath = file("src/main/resources/bahalo.accesswidener")
}

tasks.named("remapJar",RemapJarTask) {
	atAccessWideners.add("bahalo.accesswidener")
}

sourceSets {
    main {
        java { srcDirs = ["src/main/java","src/client/java"] }
        kotlin { srcDirs = ["src/main/kotlin","src/client/kotlin"] }
        resources { srcDirs = ["src/main/resources","src/client/resources"] }
    }
}

dependencies {
    minecraft "net.minecraft:minecraft:${minecraft_version}"
    neoForge "net.neoforged:neoforge:${neoforge_version}"
    mappings loom.layered {
        it.mappings("net.fabricmc:yarn:$yarn_mappings:v2")
        it.mappings("dev.architectury:yarn-mappings-patch-neoforge:1.21+build.6")
    }
    implementation "thedarkcolour:kotlinforforge-neoforge:$kff_version"

	implementation("com.github.2894638479:KotlinMCUI:v${kotlinmcui_version}")
	modImplementation("com.github.2894638479:KotlinMCUI-backend:v${kotlinmcuibackend_version}-neo-kff-${minecraft_version}")
}

processResources {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neoforge_version: neoforge_version,
            mod_version: mod_version, kff_version: kff_version,
            kotlinmcui_version: kotlinmcui_version
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(KotlinCompile).configureEach {
	compilerOptions.jvmTarget = JvmTarget.JVM_21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}


def tag = "$mod_version-$minecraft_version-$loader"

def shouldPublishProvider = providers.exec {
	commandLine 'git', 'ls-remote', '--tags', 'origin', "refs/tags/${tag}"
}.standardOutput.asText.map { it.trim().isEmpty() }

tasks.configureEach {
	if (group == 'publishing') {
		enabled = shouldPublishProvider.get()
	}
}

publishMods {
	file = remapJar.archiveFile
	additionalFiles = files(sourcesJar.archiveFile,jar.archiveFile)
	changelog = "no changelog."
	if(mod_version.toUpperCase().contains("SNAPSHOT")) {
		type = ALPHA
	} else if(mod_version.toLowerCase().contains("alpha")) {
		type = ALPHA
	} else if(mod_version.toLowerCase().contains("beta")) {
		type = BETA
	} else {
		type = STABLE
	}
	displayName = "Blue Archive Halo $loader-$mod_version"
	modLoaders.add(loader)

	modrinth {
		accessToken = providers.environmentVariable("MODRINTH_TOKEN")
		projectId = "rtLQjYeH"
		optional("modmenu")
		requires("kotlinmcui","fabric-language-kotlin")
		minecraftVersionRange {
			start = minecraft_version
			end = minecraft_version
		}
	}
	curseforge {
		accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
		projectId = "1368384"
		optional("modmenu")
		requires("kotlinmcui","fabric-language-kotlin")
		clientRequired = true
		serverRequired = false
		minecraftVersionRange {
			start = minecraft_version
			end = minecraft_version
		}
	}
	github {
		accessToken = providers.environmentVariable("GITHUB_TOKEN")
		repository = "2894638479/fabric-blue-archive-halo"
		if(loader == "fabric") {
			commitish = minecraft_version
		} else {
			commitish = "$minecraft_version-$loader"
		}
		tagName = tag
	}
}
kotlin {
	jvmToolchain(21)
}
